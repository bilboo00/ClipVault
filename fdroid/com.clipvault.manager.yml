Name: ClipVault
AutoName: ClipVault
Summary: Local-first clipboard manager
Description: |-
  ClipVault captures everything you copy and stores it in a private on-device
  SQLite database. No accounts, no cloud, no tracking.

  Features:
   * Automatic background capture (foreground service, plus an optional
     accessibility service for Android 10+ background restrictions)
   * Full-text search with highlighted matches
   * Pin, tags (10-color palette), collections, and Markdown notes
   * Temporary clips that auto-expire by time or use count
   * Biometric lock for sensitive clips
   * 13 text transformations, paste queue, and reusable snippets
   * Export history as CSV, Markdown, or plain text
   * Enhanced link previews, share-sheet capture, deep links, floating
     bubble, home screen widget, and Quick Settings tile

  The INTERNET permission is used only for optional OpenGraph link previews.
  The app has no analytics, tracking, or telemetry.

Repo: https://github.com/bilboo00/ClipVault
