name: Build release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing (optional)
        shell: bash
        run: |
          if [ -n "${{ secrets.CLIPVAULT_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.CLIPVAULT_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            printf '%s\n' \
              'CLIPVAULT_STORE_FILE=keystore.jks' \
              'CLIPVAULT_STORE_PASSWORD=${{ secrets.CLIPVAULT_STORE_PASSWORD }}' \
              'CLIPVAULT_KEY_ALIAS=${{ secrets.CLIPVAULT_KEY_ALIAS }}' \
              'CLIPVAULT_KEY_PASSWORD=${{ secrets.CLIPVAULT_KEY_PASSWORD }}' \
              > local.properties
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK signature
        if: ${{ secrets.CLIPVAULT_KEYSTORE_BASE64 != '' }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
